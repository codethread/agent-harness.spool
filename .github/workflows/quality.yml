name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-harness.spool
      - uses: actions/checkout@v4
        with:
          repository: codethread/millstrand
          ref: 5790c459e9bb692b5e975f9715df7d5b403feff2
          path: millstrand
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Provision ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          command -v rg
          rg --version
      - name: Clojure format
        working-directory: agent-harness.spool
        run: make fmt-check
      - name: clj-kondo
        working-directory: agent-harness.spool
        run: make lint-clj
      - name: splint
        working-directory: agent-harness.spool
        run: make lint-splint
      - name: Conventions
        working-directory: agent-harness.spool
        run: make lint-conventions
      - name: Reflection warnings
        working-directory: agent-harness.spool
        run: make reflect-check
      - name: Clojure test suite
        working-directory: agent-harness.spool
        run: make test
        env:
          MILLSTRAND_TEST_AWAIT_SCALE: '3'
      - name: Millstrand identity audit
        working-directory: agent-harness.spool
        run: make identity-check
